// android/build.gradle — Android library module for the sipllm_flutter FFI +
// method-channel plugin. This compiles the native engine (libsipllm_ffi.so, one
// pass per ABI, via the shared ../src/CMakeLists.txt) and the Kotlin bridge that
// exposes device profiling + the Wear OS Data Layer model transfer.
group = "com.sipllm.flutter"
version = "0.4.0"

buildscript {
    // AGP 8.5.x + Kotlin 1.9.24: a modern, stable combo compatible with the
    // Flutter 3.41 Android toolchain (Gradle 8.x, JDK 17).
    ext.kotlin_version = "1.9.24"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.5.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.sipllm.flutter"
    compileSdk = 35
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // API 24 is the Vulkan floor (libvulkan.so ships from Android 7.0); our
        // targets (POCO X6 Pro / OnePlus Watch 2) are API 34.
        minSdk = 24

        // The engine .so is C++; c++_shared is required because more than one
        // native library in the final APK may link the STL, and a single shared
        // runtime avoids the "multiple c++ runtimes" ODR hazard.
        externalNativeBuild {
            cmake {
                arguments += ["-DANDROID_STL=c++_shared", "-DSIPLLM_VULKAN=ON"]
            }
        }

        // arm64-v8a covers all targets (POCO X6 Pro, OnePlus Watch 2 / Snapdragon
        // W5, and the arm64 emulator); x86_64 for x86 emulators. 32-bit armeabi-v7a
        // is dropped for now: simd.h's fp32 NEON path uses the AArch64-only
        // vaddvq_f32 horizontal reduce, so armv7 needs a portable reduce first
        // (tracked follow-up — none of the M6.5 target devices are 32-bit).
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    // Drive the shared CMake project. Flutter's Gradle glue picks up the
    // per-ABI libsipllm_ffi.so produced here and packages it into the APK.
    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // Wearable Data Layer (ChannelClient / NodeClient / CapabilityClient) — the
    // sanctioned transport for paired phone <-> watch bulk transfer.
    implementation "com.google.android.gms:play-services-wearable:18.2.0"
}
