<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="vesselGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d0f17" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="100" cy="100" r="90" fill="url(#auraGrad)" />

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#6366f1" stroke-width="4" filter="url(#glow)" opacity="0.8" />

  <!-- Futuristic SipLLM Vessel -->
  <path d="M 50,44 Q 100,36 150,44 C 164,100 130,156 100,168 C 70,156 36,100 50,44 Z" fill="url(#vesselGrad)" />

  <!-- Inner Lightning Core -->
  <path d="M 104,56 L 84,92 L 112,96 L 92,140" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Neural Nodes -->
  <circle cx="60" cy="64" r="6" fill="#22d3ee" />
  <circle cx="140" cy="64" r="6" fill="#22d3ee" />
  <circle cx="100" cy="156" r="6" fill="#22d3ee" />
</svg>
