<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Minesweeper - SipLLM Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: #0d0f17;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .title { font-size: 28px; font-weight: 800; color: #ef4444; margin-bottom: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(8, 36px);
    grid-template-rows: repeat(8, 36px);
    gap: 4px;
    background: #1e293b;
    padding: 8px;
    border-radius: 10px;
    border: 1px solid rgba(239,68,68,0.3);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .cell {
    background: #0f172a;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .revealed { background: #334155; }
  .mine { background: #ef4444; color: white; }
  .controls { margin-top: 16px; }
  button {
    background: #ef4444;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="title">Minesweeper</div>
<div class="grid" id="grid"></div>
<div class="controls">
  <button onclick="init()">Restart</button>
</div>
<script>
const size = 8;
const minesCount = 10;
let grid = [];

function init() {
  const container = document.getElementById('grid');
  container.innerHTML = '';
  grid = [];
  for (let r = 0; r < size; r++) {
    grid[r] = [];
    for (let c = 0; c < size; c++) {
      grid[r][c] = { mine: false, revealed: false, count: 0 };
    }
  }
  let placed = 0;
  while (placed < minesCount) {
    let r = Math.floor(Math.random() * size);
    let c = Math.floor(Math.random() * size);
    if (!grid[r][c].mine) {
      grid[r][c].mine = true;
      placed++;
    }
  }
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      if (grid[r][c].mine) continue;
      let cnt = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          let nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < size && nc >= 0 && nc < size && grid[nr][nc].mine) cnt++;
        }
      }
      grid[r][c].count = cnt;
    }
  }
  render();
}

function reveal(r, c) {
  if (r < 0 || r >= size || c < 0 || c >= size || grid[r][c].revealed) return;
  grid[r][c].revealed = true;
  if (grid[r][c].mine) {
    alert('Game Over!');
    init();
    return;
  }
  if (grid[r][c].count === 0) {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        reveal(r + dr, c + dc);
      }
    }
  }
  render();
}

function render() {
  const container = document.getElementById('grid');
  container.innerHTML = '';
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const el = document.createElement('div');
      el.className = 'cell';
      const cell = grid[r][c];
      if (cell.revealed) {
        el.classList.add('revealed');
        if (cell.mine) {
          el.classList.add('mine');
          el.innerText = '💣';
        } else if (cell.count > 0) {
          el.innerText = cell.count;
        }
      }
      el.onclick = () => reveal(r, c);
      container.appendChild(el);
    }
  }
}

init();
</script>
</body>
</html>
