<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake - SipLLM Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: #0d0f17;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 340px;
    margin-bottom: 16px;
  }
  .title { font-size: 28px; font-weight: 800; color: #10b981; }
  .score { font-size: 18px; font-weight: 700; color: #f8fafc; }
  canvas {
    background: #1e293b;
    border-radius: 12px;
    border: 1px solid rgba(16,185,129,0.3);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .d-pad {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(3, 50px);
    grid-template-rows: repeat(3, 50px);
    gap: 8px;
  }
  .btn {
    background: #1e293b;
    color: #10b981;
    border: 1px solid rgba(16,185,129,0.3);
    border-radius: 10px;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .btn:active { background: #10b981; color: #0d0f17; }
  .up { grid-column: 2; grid-row: 1; }
  .left { grid-column: 1; grid-row: 2; }
  .right { grid-column: 3; grid-row: 2; }
  .down { grid-column: 2; grid-row: 3; }
</style>
</head>
<body>
<div class="header">
  <div class="title">Snake</div>
  <div class="score">Score: <span id="score">0</span></div>
</div>
<canvas id="canvas" width="320" height="320"></canvas>
<div class="d-pad">
  <div class="btn up" onclick="setDir('U')">▲</div>
  <div class="btn left" onclick="setDir('L')">◀</div>
  <div class="btn right" onclick="setDir('R')">▶</div>
  <div class="btn down" onclick="setDir('D')">▼</div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const grid = 16;
let snake = [{x: 160, y: 160}, {x: 144, y: 160}, {x: 128, y: 160}];
let food = {x: 80, y: 80};
let dx = grid, dy = 0;
let score = 0;
let gameInterval;

function spawnFood() {
  food.x = Math.floor(Math.random() * (canvas.width / grid)) * grid;
  food.y = Math.floor(Math.random() * (canvas.height / grid)) * grid;
}

function setDir(d) {
  if (d === 'U' && dy === 0) { dx = 0; dy = -grid; }
  if (d === 'D' && dy === 0) { dx = 0; dy = grid; }
  if (d === 'L' && dx === 0) { dx = -grid; dy = 0; }
  if (d === 'R' && dx === 0) { dx = grid; dy = 0; }
}

function update() {
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height ||
      snake.some(segment => segment.x === head.x && segment.y === head.y)) {
    snake = [{x: 160, y: 160}, {x: 144, y: 160}, {x: 128, y: 160}];
    dx = grid; dy = 0; score = 0;
    document.getElementById('score').innerText = score;
    spawnFood();
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').innerText = score;
    spawnFood();
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.arc(food.x + grid/2, food.y + grid/2, grid/2 - 2, 0, Math.PI * 2);
  ctx.fill();

  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#10b981' : '#34d399';
    ctx.fillRect(s.x, s.y, grid - 1, grid - 1);
  });
}

function gameLoop() {
  update();
  draw();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') setDir('U');
  if (e.key === 'ArrowDown') setDir('D');
  if (e.key === 'ArrowLeft') setDir('L');
  if (e.key === 'ArrowRight') setDir('R');
});

spawnFood();
gameInterval = setInterval(gameLoop, 100);
</script>
</body>
</html>
