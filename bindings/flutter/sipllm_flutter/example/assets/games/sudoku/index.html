<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sudoku - SipLLM Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: #0d0f17;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .title { font-size: 28px; font-weight: 800; color: #38bdf8; margin-bottom: 16px; }
  .board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    width: 320px;
    height: 320px;
    background: #0f172a;
    border: 2px solid #38bdf8;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .cell {
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .cell:nth-child(3n) { border-right: 2px solid #38bdf8; }
  .cell:nth-child(9n) { border-right: none; }
  .cell-row-3 { border-bottom: 2px solid #38bdf8; }
  .selected { background: rgba(56,189,248,0.25); }
  .fixed { color: #94a3b8; }
  .user-val { color: #38bdf8; }
  .num-pad {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(5, 50px);
    gap: 8px;
  }
  .btn {
    background: #1e293b;
    color: #38bdf8;
    border: 1px solid rgba(56,189,248,0.3);
    border-radius: 8px;
    height: 40px;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .btn:active { background: #38bdf8; color: #0d0f17; }
</style>
</head>
<body>
<div class="title">Sudoku</div>
<div class="board" id="board"></div>
<div class="num-pad" id="numpad"></div>
<script>
const puzzle = [
  5,3,0, 0,7,0, 0,0,0,
  6,0,0, 1,9,5, 0,0,0,
  0,9,8, 0,0,0, 0,6,0,

  8,0,0, 0,6,0, 0,0,3,
  4,0,0, 8,0,3, 0,0,1,
  7,0,0, 0,2,0, 0,0,6,

  0,6,0, 0,0,0, 2,8,0,
  0,0,0, 4,1,9, 0,0,5,
  0,0,0, 0,8,0, 0,7,9
];
let current = [...puzzle];
let selectedIdx = -1;

function render() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  current.forEach((val, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    if (Math.floor(i / 9) === 2 || Math.floor(i / 9) === 5) cell.classList.add('cell-row-3');
    if (i === selectedIdx) cell.classList.add('selected');
    if (puzzle[i] !== 0) {
      cell.classList.add('fixed');
      cell.innerText = puzzle[i];
    } else if (val !== 0) {
      cell.classList.add('user-val');
      cell.innerText = val;
    }
    cell.onclick = () => { selectedIdx = i; render(); };
    boardEl.appendChild(cell);
  });
}

const pad = document.getElementById('numpad');
for (let n = 1; n <= 9; n++) {
  const b = document.createElement('div');
  b.className = 'btn';
  b.innerText = n;
  b.onclick = () => {
    if (selectedIdx >= 0 && puzzle[selectedIdx] === 0) {
      current[selectedIdx] = n;
      render();
    }
  };
  pad.appendChild(b);
}
const clr = document.createElement('div');
clr.className = 'btn';
clr.innerText = 'C';
clr.onclick = () => {
  if (selectedIdx >= 0 && puzzle[selectedIdx] === 0) {
    current[selectedIdx] = 0;
    render();
  }
};
pad.appendChild(clr);

render();
</script>
</body>
</html>
