<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 - SipLLM Studio</title>
<style>
  html, body {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    touch-action: none;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background-color: #0d0f17;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 90%;
    max-width: 340px;
    margin-bottom: 12px;
  }
  .title { font-size: 28px; font-weight: 800; color: #6366f1; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: #1e293b;
    padding: 6px 12px;
    border-radius: 8px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .score-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
  .score-val { font-size: 16px; font-weight: 700; color: #f8fafc; }
  .grid-container {
    width: 90vw;
    height: 90vw;
    max-width: 320px;
    max-height: 320px;
    background: #1e293b;
    border-radius: 14px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 8px;
    position: relative;
    border: 1px solid rgba(99,102,241,0.2);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .cell {
    background: #0f172a;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    transition: all 0.15s ease-in-out;
  }
  .t-2 { background: #312e81; color: #818cf8; }
  .t-4 { background: #3730a3; color: #a5b4fc; }
  .t-8 { background: #4338ca; color: #c7d2fe; }
  .t-16 { background: #4f46e5; color: #ffffff; }
  .t-32 { background: #6366f1; color: #ffffff; }
  .t-64 { background: #818cf8; color: #0f172a; }
  .t-128 { background: #ec4899; color: #ffffff; font-size: 18px; }
  .t-256 { background: #f43f5e; color: #ffffff; font-size: 18px; }
  .t-512 { background: #10b981; color: #ffffff; font-size: 18px; }
  .t-1024 { background: #06b6d4; color: #ffffff; font-size: 15px; }
  .t-2048 { background: #f59e0b; color: #ffffff; font-size: 15px; box-shadow: 0 0 15px #f59e0b; }
  .controls {
    margin-top: 14px;
    display: flex;
    gap: 10px;
  }
  button {
    background: #6366f1;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button:active { transform: scale(0.95); }
</style>
</head>
<body>
<div class="header">
  <div class="title">2048</div>
  <div class="scores">
    <div class="score-box"><div class="score-label">Score</div><div class="score-val" id="score">0</div></div>
    <div class="score-box"><div class="score-label">Best</div><div class="score-val" id="best">0</div></div>
  </div>
</div>
<div class="grid-container" id="grid"></div>
<div class="controls">
  <button onclick="initGame()">New Game</button>
</div>
<script>
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

let board = Array(16).fill(0);
let score = 0;
let best = 0;

function initGame() {
  board = Array(16).fill(0);
  score = 0;
  addTile();
  addTile();
  updateUI();
}

function addTile() {
  let empty = [];
  board.forEach((v, i) => { if (v === 0) empty.push(i); });
  if (empty.length > 0) {
    let rand = empty[Math.floor(Math.random() * empty.length)];
    board[rand] = Math.random() < 0.9 ? 2 : 4;
  }
}

function updateUI() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  board.forEach(v => {
    let cell = document.createElement('div');
    cell.className = 'cell ' + (v > 0 ? 't-' + v : '');
    cell.innerText = v > 0 ? v : '';
    grid.appendChild(cell);
  });
  document.getElementById('score').innerText = score;
  if (score > best) best = score;
  document.getElementById('best').innerText = best;
}

function slide(row) {
  let arr = row.filter(val => val);
  for (let i = 0; i < arr.length - 1; i++) {
    if (arr[i] === arr[i+1]) {
      arr[i] *= 2;
      score += arr[i];
      arr[i+1] = 0;
    }
  }
  arr = arr.filter(val => val);
  while (arr.length < 4) arr.push(0);
  return arr;
}

function move(dir) {
  let oldBoard = [...board];
  for (let i = 0; i < 4; i++) {
    let row = [];
    for (let j = 0; j < 4; j++) {
      let idx = dir === 'L' || dir === 'R' ? i * 4 + j : j * 4 + i;
      row.push(board[idx]);
    }
    if (dir === 'R' || dir === 'D') row.reverse();
    row = slide(row);
    if (dir === 'R' || dir === 'D') row.reverse();
    for (let j = 0; j < 4; j++) {
      let idx = dir === 'L' || dir === 'R' ? i * 4 + j : j * 4 + i;
      board[idx] = row[j];
    }
  }
  if (JSON.stringify(oldBoard) !== JSON.stringify(board)) {
    addTile();
    updateUI();
  }
}

let startX, startY;
document.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!startX || !startY) return;
  let dx = e.changedTouches[0].clientX - startX;
  let dy = e.changedTouches[0].clientY - startY;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (Math.abs(dx) > 20) move(dx > 0 ? 'R' : 'L');
  } else {
    if (Math.abs(dy) > 20) move(dy > 0 ? 'D' : 'U');
  }
  startX = null; startY = null;
}, { passive: true });

initGame();
</script>
</body>
</html>
