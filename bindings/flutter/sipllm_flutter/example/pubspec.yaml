name: local_llm_chat
description: "SipLLM local LLM chat — on-device streaming inference (bigger-than-RAM), a resumable Hugging Face downloader, and phone -> Wear OS model transfer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # The SipLLM FFI plugin (this repo).
  sipllm_flutter:
    path: ../

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  provider: ^6.1.2
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^8.1.6
  share_plus: ^10.1.4
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/models/
    - assets/games/2048/
    - assets/games/snake/
    - assets/games/sudoku/
    - assets/games/minesweeper/
