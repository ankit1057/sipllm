name: Release binaries

# Builds prebuilt sipllm bundles for Linux on x86_64 and aarch64 and attaches
# them to the GitHub release. Asset names match what install.sh expects:
# sipllm-<version>-<os>-<arch>.tar.gz  (os = linux, arch = x86_64|aarch64).
# Triggered by pushing a version tag (v*), or manually.
#
# macOS (darwin x86_64/aarch64) bundles are NOT built on CI — they are built and
# uploaded manually from a local macOS machine via scripts/release-macos.sh.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the asset name (defaults to install.sh's)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Baseline ISA for the main build (runs on any CPU of that arch). On
          # aarch64 the SDOT kernels are compiled separately and picked at runtime;
          # on x86_64 a second AVX2+FMA build is shipped and the `sipllm` launcher
          # picks it when the CPU has both (Issue #68).
          - { runner: ubuntu-latest,     os: linux,  arch: x86_64,  archflags: "-march=x86-64", avx2: true }
          - { runner: ubuntu-24.04-arm,  os: linux,  arch: aarch64, archflags: "",              avx2: false }
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            case "${GITHUB_REF_NAME:-}" in
              v*) V="${GITHUB_REF_NAME#v}" ;;
              *)  V="$(sed -n 's/^VERSION="\(.*\)"/\1/p' install.sh | head -1)" ;;
            esac
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version: $V"

      - name: Build (portable ARCHFLAGS)
        run: |
          make -j"$(getconf _NPROCESSORS_ONLN)" ARCHFLAGS="${{ matrix.archflags }}" all
          make ARCHFLAGS="${{ matrix.archflags }}" server

      - name: Test
        run: make ARCHFLAGS="${{ matrix.archflags }}" test

      - name: Test the no-int8-kernel fallback (SIPLLM_CPU=generic)
        run: SIPLLM_CPU=generic make ARCHFLAGS="${{ matrix.archflags }}" test

      - name: Build + test the AVX2 variant (x86_64)
        if: matrix.avx2
        run: |
          make -j"$(getconf _NPROCESSORS_ONLN)" BUILD=build-avx2 ARCHFLAGS="-mavx2 -mfma" build-avx2/llm
          make BUILD=build-avx2 ARCHFLAGS="-mavx2 -mfma" server
          make BUILD=build-avx2 ARCHFLAGS="-mavx2 -mfma" test

      - name: Sanity — synthesize a toy GGUF and run it
        run: |
          ./build/make_toy_model /tmp/toy.gguf --gguf
          ./build/llm /tmp/toy.gguf -p "hello" -n 4 --greedy

      - name: Stage bundle
        id: stage
        run: |
          V="${{ steps.ver.outputs.version }}"
          DIST="sipllm-${V}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir "$DIST"
          cp sipllm            "$DIST/sipllm"
          cp build/llm         "$DIST/llm-engine"      # CLI looks for llm-engine
          cp build/llm_server  "$DIST/llm_server"      2>/dev/null || true
          if [ -x build-avx2/llm ]; then                 # x86_64: AVX2+FMA variant
            cp build-avx2/llm        "$DIST/llm-engine-avx2"
            cp build-avx2/llm_server "$DIST/llm_server-avx2" 2>/dev/null || true
            chmod +x "$DIST/llm-engine-avx2"
          fi
          for t in dump_logits bench inspect_gguf make_toy_model gguf_to_f16; do
            cp "build/$t" "$DIST/$t" 2>/dev/null || true
          done
          cp LICENSE README.md "$DIST/" 2>/dev/null || true
          chmod +x "$DIST"/sipllm "$DIST"/llm-engine
          tar -czf "$DIST.tar.gz" "$DIST"
          echo "asset=$DIST.tar.gz" >> "$GITHUB_OUTPUT"
          ls -la "$DIST.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.asset }}
          path: ${{ steps.stage.outputs.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.stage.outputs.asset }}
