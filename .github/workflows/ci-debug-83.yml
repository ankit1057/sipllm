name: CI debug (x86 unit-test hang, #83)

# Throwaway: hunts the x86_64 `make test` hang seen on PR #83. Each test binary
# runs under a 120 s watchdog; on a hang the job prints the line-buffered output
# so far and every thread's backtrace. 7fefb1c is the loader fix (three runs per
# compiler, to land on more CPU models); fa509da, the unfixed PR head, is the control.

on:
  push:
    branches: ['ci-debug/**']
  workflow_dispatch:

jobs:
  hang-hunt:
    name: ${{ matrix.label }} (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        label: [fix-7fefb1c-a, fix-7fefb1c-b, fix-7fefb1c-c, control-fa509da]
        cc: [g++, clang++]
        include:
          - { label: fix-7fefb1c-a,   ref: 7fefb1c17970e19acc79bf13ee018b705a2ff26f }
          - { label: fix-7fefb1c-b,   ref: 7fefb1c17970e19acc79bf13ee018b705a2ff26f }
          - { label: fix-7fefb1c-c,   ref: 7fefb1c17970e19acc79bf13ee018b705a2ff26f }
          - { label: control-fa509da, ref: fa509da04341d760b910555e84322a8ed4cc4980 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Host
        run: |
          git log -1 --format='%h %s'
          lscpu | grep -E 'Model name|Vendor ID|^CPU\(s\)|Thread|Flags' | cut -c1-200
          cat /proc/sys/kernel/yama/ptrace_scope || true

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang gdb

      - name: Build engine and test binaries
        run: |
          make -j"$(nproc)" CXX=${{ matrix.cc }} all
          make -j"$(nproc)" CXX=${{ matrix.cc }} $(ls tests/*.cpp | sed 's#tests/\(.*\)\.cpp#build/\1#')

      - name: Run tests under a watchdog
        run: |
          set -u
          bad=0
          run_one() {   # $1 binary, $2 label; 0 = pass, 1 = fail or hang
            stdbuf -oL -eL "$1" > out.txt 2>&1 &
            local pid=$!
            for s in $(seq 1 1200); do kill -0 $pid 2>/dev/null || break; sleep 0.1; done
            if kill -0 $pid 2>/dev/null; then
              echo "::error::HANG $2"
              echo "----- output so far"; cat out.txt
              echo "----- threads"
              sudo gdb -p $pid -batch -ex "info threads" -ex "thread apply all bt" 2>&1 | grep -v -E '^\[(New LWP|Thread debugging)'
              sudo kill -9 $pid; wait $pid 2>/dev/null
              return 1
            fi
            wait $pid; local rc=$?
            if [ $rc -ne 0 ]; then echo "::error::FAIL rc=$rc $2"; cat out.txt; return 1; fi
            return 0
          }
          bins=$(ls tests/*.cpp | sed 's#tests/\(.*\)\.cpp#build/\1#')
          for pass in 1 2 3; do
            for t in $bins; do
              run_one "$t" "$t pass $pass" || { bad=1; echo "(stopping full-suite passes)"; break 2; }
            done
            echo "full suite pass $pass ok"
          done
          for t in build/test_prefill build/test_ram_budget build/test_e2e; do
            for i in $(seq 1 30); do
              run_one "$t" "$t repeat $i" || { bad=1; break; }
            done
            echo "$t repeats done (last $i)"
          done
          exit $bad
